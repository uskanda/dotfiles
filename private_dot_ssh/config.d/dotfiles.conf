# ~/.ssh/config.d/dotfiles.conf — chezmoi 管理（~/dotfiles/private_dot_ssh/config.d/dotfiles.conf）
#
# 全ホスト共通の既定値。~/.ssh/config の末尾から Include される
# （private_dot_ssh/modify_private_config がそのブロックを置く）。ssh_config は
# 「最初に得た値が勝つ」ので、~/.ssh/config 本体に書いた値の方が優先される。
# 端末やホストごとに変えたいときは本体側に書けばよい。

Host *
    # 15 秒ごとに生存確認を送り、8 回（= 2 分）続けて返事が無ければ切る。
    #   - 間隔を短くするのは、スリープ復帰後に死んだ接続へ早く 1 発送って RST を
    #     受け取り、ssh-reconnect の張り直しを早く始めさせるため
    #   - 回数を多くするのは、起きている間の一時的な断（Wi-Fi の掴み直し等）では
    #     切らないため
    # 送り続けることで WSL2（NAT モード）やルータの変換表が空くのも防ぐ。
    # スリープ中はクライアントごと止まるので、これだけでスリープを跨げるわけではない。
    ServerAliveInterval 15
    ServerAliveCountMax 8
