# ~/.config/tmux/tmux.conf
# tmux 3.4 / chezmoi 管理

# ----------------------------------------------------------------------
# プレフィックス: C-b -> C-j
# ----------------------------------------------------------------------
unbind C-b
set -g prefix C-j
# プレフィックスを2回押すと次のウィンドウへ移動する。-r なので、続けて C-j を
# 叩けばそのまま巡回できる。
#
# Enter は CR (^M)、プレフィックスは LF (^J) で別のキーなので、これを掴んでも
# vim や zsh の Enter は阻害しない（tmux 内の vim で実際に確認済み）。
# 代償として、アプリ側へ生の C-j を送る手段は無くなる（従来の send-prefix）。
# zsh の ^J は accept-line だが Enter で代用できるので実害は無い。
bind -r C-j next-window

# ----------------------------------------------------------------------
# 端末・色 (TrueColor)
# ----------------------------------------------------------------------
set -g default-terminal "tmux-256color"
# alacritty / xterm-256color で 24bit カラーを有効化
set -as terminal-features ",alacritty:RGB"
set -as terminal-features ",xterm-256color:RGB"

# ----------------------------------------------------------------------
# 基本的な使い勝手
# ----------------------------------------------------------------------
set -g mouse on                 # マウスでペイン選択・リサイズ・スクロール
set -g history-limit 50000      # スクロールバックを拡大
set -sg escape-time 10          # ESC の遅延を短く (vim/nvim 用)
set -g focus-events on          # フォーカスイベントを通知 (vim の autoread 等)
set -g display-time 2000        # メッセージ表示を 2 秒に
set -g set-clipboard on         # OSC52 でシステムクリップボードと連携 (SSH 越しも可)

# クライアントが attach し直したときに引き直す環境変数。
# 既定値 (DISPLAY SSH_AUTH_SOCK 等) に WezTerm の mux ソケットを足している。
# WezTerm を再起動すると古い WEZTERM_UNIX_SOCKET を掴んだままになり、
# ~/.config/shell/ssh-window.sh の `wezterm cli` が刺さらなくなるため。
set -g update-environment "DISPLAY KRB5CCNAME SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY WEZTERM_UNIX_SOCKET WEZTERM_PANE"

# ウィンドウ/ペイン番号を 1 始まりに
set -g base-index 1
setw -g pane-base-index 1
# ウィンドウを閉じたら番号を詰める
set -g renumber-windows on

# ----------------------------------------------------------------------
# キーバインド
# ----------------------------------------------------------------------
# 設定リロード (prefix r)
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# 直感的な分割 ( | 横 / - 縦 ) — カレントディレクトリを引き継ぐ
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
# 新規ウィンドウもカレントディレクトリを引き継ぐ
bind c new-window -c "#{pane_current_path}"

# vim 風のペイン移動 (prefix h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ペインのリサイズ (prefix を押しながら H/J/K/L をリピート)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ----------------------------------------------------------------------
# コピーモード (vi 風)
# ----------------------------------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
